<style>
/* Layout: satu kolom sempit di tengah, formulir di atas, hasil muncul tepat di bawahnya. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --fg: #14201d;
  --muted: #55645f;
  --line: #d5dcd9;
  --accent: #0b5d4b;
  --accent-fg: #ffffff;
  --ok-bg: #e3f3ec;
  --ok-fg: #0a5a3f;
  --bad-bg: #fbe9e6;
  --bad-fg: #8f2a1c;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1715;
    --surface: #17221f;
    --fg: #e6efec;
    --muted: #93a39d;
    --line: #2b3a36;
    --accent: #4fc0a0;
    --accent-fg: #07211a;
    --ok-bg: #12332a;
    --ok-fg: #7fdcb9;
    --bad-bg: #3a1a15;
    --bad-fg: #f1a597;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1715;
  --surface: #17221f;
  --fg: #e6efec;
  --muted: #93a39d;
  --line: #2b3a36;
  --accent: #4fc0a0;
  --accent-fg: #07211a;
  --ok-bg: #12332a;
  --ok-fg: #7fdcb9;
  --bad-bg: #3a1a15;
  --bad-fg: #f1a597;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 24px; }
.eyebrow {
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 0 0 6px;
}
h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(28px, 7vw, 36px); line-height: 1.15; margin: 0 0 8px;
  text-wrap: balance;
}
.lead { margin: 0; color: var(--muted); max-width: 60ch; }

form {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 20px; display: grid; gap: 16px;
}
.field { display: grid; gap: 6px; min-width: 0; }
label { font-weight: 500; font-size: 14px; }
input {
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 11px 12px; width: 100%; min-width: 0;
}
input#nip { font-family: var(--font-mono); letter-spacing: .02em; }
input:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.brand {
  background: #ffffff; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand img { height: 56px; width: auto; max-width: 45%; object-fit: contain; display: block; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
button {
  font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 6px; padding: 12px 16px;
}
button:hover { filter: brightness(1.08); }
button:disabled { opacity: .6; cursor: progress; }

#hasil[hidden] { display: none !important; }
.card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.status { padding: 14px 20px; font-weight: 600; }
.status.ok { background: var(--ok-bg); color: var(--ok-fg); }
.status.bad { background: var(--bad-bg); color: var(--bad-fg); }
.body { padding: 4px 20px 8px; }
.body p.msg { margin: 14px 0; color: var(--muted); }
dl { margin: 0; }
.row {
  display: grid; grid-template-columns: 7.5rem 1fr; gap: 4px 16px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dd.mono { font-family: var(--font-mono); font-size: 15px; }
dd .pending { color: var(--muted); }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }

footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: in .2s ease-out; }
  @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<script>
//#core-start
function b64ToBytes(b64) {
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function toHex(u8) {
  var s = "";
  for (var i = 0; i < u8.length; i++) s += (u8[i] < 16 ? "0" : "") + u8[i].toString(16);
  return s;
}
/* Dari NIP diturunkan dua hal: id pencarian (16 byte pertama) dan kunci dekripsi (32 byte terakhir). */
async function derive(nip) {
  var subtle = globalThis.crypto && globalThis.crypto.subtle;
  if (!subtle) throw new Error("no-subtle");
  var base = await subtle.importKey("raw", new TextEncoder().encode(nip), "PBKDF2", false, ["deriveBits"]);
  var bits = await subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(KDF_SALT), iterations: KDF_ITER }, base, 512);
  var u = new Uint8Array(bits);
  return { id: toHex(u.slice(0, 16)), key: u.slice(32, 64) };
}
async function decryptRecord(b64, keyBytes) {
  var subtle = globalThis.crypto.subtle;
  var all = b64ToBytes(b64);
  var key = await subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
  var pt = await subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, key, all.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* Huruf saja, tanpa gelar depan (dr, drg, dll) dan tanpa gelar belakang setelah koma. */
function namaInti(s, potongKoma) {
  s = String(s).toLowerCase();
  if (potongKoma) s = s.split(",")[0];
  s = s.replace(/^\s*((dr|drg|drs|dra|prof|ir|hj|h)\b[\s.]*)+/, "");
  return s.replace(/[^a-z]/g, "");
}
/* Cocok bila nama yang diketik diawali nama inti di data. Gelar di belakang boleh ikut diketik. */
function namaCocok(ketik, namaData) {
  var a = namaInti(ketik, false), b = namaInti(namaData, true);
  return b.length > 0 && a.indexOf(b) === 0;
}
//#core-end
</script>

<script>
var form = document.getElementById("form");
var hasil = document.getElementById("hasil");
var inNama = document.getElementById("nama");
var inNip = document.getElementById("nip");
var tombol = document.getElementById("cek");

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtNip(n) {
  return n.slice(0, 8) + " " + n.slice(8, 14) + " " + n.slice(14, 15) + " " + n.slice(15);
}
function fmtTanggal(iso) {
  var p = iso.split("-");
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  return d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
}
function tampil(html) { hasil.innerHTML = html; hasil.hidden = false; }
function gagal(judul, pesan) {
  tampil('<div class="card"><div class="status bad">' + esc(judul) + '</div><div class="body"><p class="msg">' + esc(pesan) + '</p></div></div>');
}
function belum() { return '<span class="pending">Belum diumumkan</span>'; }

function barisJadwal() {
  if (!TES.tanggal && !TES.jam) return belum();
  var s = TES.tanggal ? esc(fmtTanggal(TES.tanggal)) : "";
  if (TES.jam) s += (s ? "<br>" : "") + esc(TES.jam);
  return s;
}
function barisLokasi() {
  if (!TES.lokasi) return belum();
  return esc(TES.lokasi) + (TES.alamat ? "<br>" + esc(TES.alamat) : "");
}

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  var nama = inNama.value.trim();
  var nip = inNip.value.replace(/\s+/g, "");

  if (!nama || !nip) { gagal("Data belum lengkap", "Isi nama dan NIP, lalu tekan Cek."); return; }
  if (!/^\d{18}$/.test(nip)) { gagal("NIP tidak valid", "NIP harus berupa 18 digit angka. Periksa kembali yang Anda ketik."); return; }

  tombol.disabled = true;
  tombol.textContent = "Memeriksa...";
  try {
    var d = await derive(nip);
    var rec = DB[d.id];
    if (!rec) {
      gagal("Tidak terdaftar", "NIP ini tidak ada dalam daftar peserta ProASN 2026. Hubungi BKPSDM jika Anda merasa seharusnya terdaftar.");
      return;
    }
    var data = await decryptRecord(rec, d.key);
    if (!namaCocok(nama, data.n)) {
      gagal("Nama tidak sesuai", "Nama yang Anda masukkan tidak cocok dengan NIP tersebut. Periksa penulisan nama sesuai data kepegawaian.");
      return;
    }
    tampil(
      '<div class="card">' +
        '<div class="status ok">Terdaftar sebagai peserta ProASN 2026</div>' +
        '<div class="body"><dl>' +
          '<div class="row"><dt>Nama</dt><dd>' + esc(data.n) + '</dd></div>' +
          '<div class="row"><dt>NIP</dt><dd class="mono">' + esc(fmtNip(nip)) + '</dd></div>' +
          '<div class="row"><dt>Jabatan</dt><dd>' + esc(data.j) + '</dd></div>' +
          '<div class="row"><dt>Unit kerja</dt><dd>' + esc(data.u) + '</dd></div>' +
          '<div class="row"><dt>Jadwal tes</dt><dd>' + barisJadwal() + '</dd></div>' +
          '<div class="row"><dt>Lokasi tes</dt><dd>' + barisLokasi() + '</dd></div>' +
        '</dl></div>' +
      '</div>'
    );
  } catch (err) {
    gagal("Pengecekan gagal", "Browser Anda tidak dapat memproses pengecekan ini. Coba buka halaman dengan Chrome atau Safari versi terbaru.");
  } finally {
    tombol.disabled = false;
    tombol.textContent = "Cek";
  }
});

[inNama, inNip].forEach(function (el) {
  el.addEventListener("input", function () { hasil.hidden = true; });
});
</script>
